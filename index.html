        const Countdown = ({ targetDate }) => {
            const [timeLeft, setTimeLeft] = React.useState({ days: 0, hours: 0, minutes: 0 });

            React.useEffect(() => {
                const interval = setInterval(() => {
                    const now = new Date();
                    const target = new Date(targetDate);
                    const diff = target - now;
                    if (diff > 0) {
                        setTimeLeft({
                            days: Math.floor(diff / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
                            minutes: Math.floor((diff / 1000 / 60) % 60)
                        });
                    }
                }, 1000);
                return () => clearInterval(interval);
            }, [targetDate]);

            return (
                <div className="bg-white/20 backdrop-blur-md rounded-xl p-4 text-center border border-white/30 text-white inline-block mt-4 shadow-lg">
                    <p className="text-sm uppercase tracking-wider mb-2 font-medium opacity-90">זמן עד להמראה</p>
                    <div className="flex gap-4 justify-center" dir="ltr">
                        <div className="flex flex-col items-center">
                            <span className="text-3xl font-bold">{timeLeft.days}</span>
                            <span className="text-xs">ימים</span>
                        </div>
                        <span className="text-2xl font-bold opacity-50">:</span>
                        <div className="flex flex-col items-center">
                            <span className="text-3xl font-bold">{String(timeLeft.hours).padStart(2, '0')}</span>
                            <span className="text-xs">שעות</span>
                        </div>
                        <span className="text-2xl font-bold opacity-50">:</span>
                        <div className="flex flex-col items-center">
                            <span className="text-3xl font-bold">{String(timeLeft.minutes).padStart(2, '0')}</span>
                            <span className="text-xs">דקות</span>
                        </div>
                    </div>
                </div>
            );
        };

                                <span className={`text-sm font-semibold px-2 py-0.5 rounded-full ${isHoliday ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-600'}`}>

                    </div>

                                        </div>

                                <li>הצטיידות לקראת שבת: הסופר Papantoniou בפוליס מצוין ומכיל כמעט הכל. עדיף להגיע מוקדם בשישי כדי להימנע מתור.</li>
